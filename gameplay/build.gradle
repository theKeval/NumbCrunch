plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "io.keval.apps.numbcrunch.gameplay"
    compileSdk = 36

    defaultConfig {
        minSdk = 21
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':core-ui')
    implementation project(':domain')

    implementation "androidx.core:core-ktx:$version_core"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$version_lifecycle"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$version_lifecycle"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$version_lifecycle"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$version_lifecycle"
    implementation "androidx.activity:activity-compose:$version_activity_compose"
    implementation "androidx.compose.foundation:foundation:1.7.8"
    implementation "androidx.compose.ui:ui:$version_compose_ui"
    implementation "androidx.compose.ui:ui-tooling-preview:$version_compose_ui"
    implementation "androidx.compose.material3:material3:$version_compose_material3"
    implementation "androidx.compose.material:material-icons-extended:$version_compose_ui"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$version_coroutine"

    debugImplementation "androidx.compose.ui:ui-tooling:$version_compose_ui"
}

// Bundles the repository's PRIVACY.md as the "privacy_policy.md" asset shown by the in-game
// Privacy policy screen, so the app and the published policy never drift apart.
abstract class BundlePrivacyPolicy extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getPolicy()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void bundle() {
        def target = outputDirectory.file('privacy_policy.md').get().asFile
        target.text = policy.get().asFile.getText('UTF-8')
    }
}

def bundlePrivacyPolicy = tasks.register('bundlePrivacyPolicy', BundlePrivacyPolicy) {
    policy = rootProject.layout.projectDirectory.file('PRIVACY.md')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(bundlePrivacyPolicy) { it.outputDirectory }
    }
}
